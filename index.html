<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallapop Wingfoil Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151b2d;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.15);
            --accent: #d97706;
            --danger: #ef4444;
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.25);
            --border-color: #1f2937;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            padding: 2rem;
            line-height: 1.5;
            font-size: 18px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            width: 100%;
        }
        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
            flex: 1;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .stat-card h3 {
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        .stat-card p {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
        }
        .stat-card.highlight p {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
        }
        .controls {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box {
            flex: 1;
            min-width: 280px;
        }
        .search-box input {
            width: 100%;
            padding: 0.9rem 1.3rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1.15rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--primary);
        }
        .filter-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.75rem 1.3rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            border-color: var(--primary);
        }
        .filter-btn.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #0b0f19;
            font-weight: 600;
        }
        .sort-select {
            padding: 0.8rem 1.3rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1.05rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
        }
        .card.match {
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px var(--gold-glow);
        }
        .card-body {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
            display: block;
            background-color: #0b0f19;
        }
        .card-image-placeholder {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #111827, #1f2937);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }
        .card-title {
            font-size: 1.45rem;
            font-weight: 600;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .card-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            background-color: var(--primary-glow);
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            white-space: nowrap;
        }
        .card-meta {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
        }
        .card-badges {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .badge {
            font-size: 0.88rem;
            font-weight: 600;
            padding: 0.35rem 0.65rem;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-status {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--primary);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .badge-status.reservado {
            background-color: rgba(217, 119, 6, 0.1);
            color: var(--accent);
            border: 1px solid rgba(217, 119, 6, 0.2);
        }
        .badge-status.vendido {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .badge-shipping {
            background-color: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        .badge-shipping.no {
            background-color: rgba(156, 163, 175, 0.1);
            color: var(--text-muted);
            border: 1px solid rgba(156, 163, 175, 0.2);
        }
        .badge-info {
            background-color: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        .badge-criteria {
            background-color: var(--gold-glow);
            color: var(--gold);
            border: 1px solid var(--gold);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }
        .card-description {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
            transition: color 0.2s;
            white-space: pre-line;
            line-height: 1.5;
        }
        .card-description:hover {
            color: var(--text-color);
        }
        .card-description.expanded {
            display: block;
            overflow: visible;
            -webkit-line-clamp: unset;
        }
        .card-footer {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            display: flex;
            justify-content: flex-end;
        }
        .btn-link {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            color: #0b0f19;
            text-decoration: none;
            padding: 0.8rem 1.6rem;
            border-radius: 6px;
            font-size: 1.15rem;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.1s;
            text-align: center;
        }
        .btn-link:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            font-size: 1.3rem;
            grid-column: 1 / -1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        .card-image-container {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
        .card-image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 25, 0.4);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .card-image-container:hover .card-image-overlay {
            opacity: 1;
        }
        .badge-photos-count {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(11, 15, 25, 0.85);
            color: #ffffff;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }
        /* Modal Lightbox */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 25, 0.95);
            align-items: center;
            justify-content: center;
        }
        .modal-content-wrapper {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .modal-img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: var(--danger);
        }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            color: #ffffff;
            font-size: 2rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.2s;
            user-select: none;
            outline: none;
        }
        .nav-btn:hover {
            background-color: var(--primary);
            color: #0b0f19;
            border-color: var(--primary);
        }
        .prev-btn {
            left: -70px;
        }
        .next-btn {
            right: -70px;
        }
        @media (max-width: 768px) {
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
            .modal-img { max-height: 60vh; }
            
            /* Mejoras de texto responsivo para móvil */
            body {
                font-size: 20px;
            }
            .card-title {
                font-size: 1.65rem;
            }
            .card-description {
                font-size: 1.25rem;
            }
            .card-meta {
                font-size: 1.15rem;
            }
            .badge {
                font-size: 0.95rem;
                padding: 0.4rem 0.7rem;
            }
            .btn-link {
                font-size: 1.25rem;
                padding: 1rem 1.6rem;
                width: 100%;
                text-align: center;
            }
            
            /* Textos más grandes en el panel de filtros en móvil */
            .controls-panel label, 
            .controls-panel input, 
            .controls-panel select, 
            .controls-panel button,
            .controls-panel span {
                font-size: 1.25rem !important;
            }
            
            .controls-header span {
                font-size: 1.45rem !important;
            }
            
            .filter-btn {
                padding: 1rem 1.4rem !important;
            }
        }
        .modal-info {
            margin-top: 1rem;
            color: var(--text-color);
            font-size: 1rem;
            text-align: center;
            font-weight: 600;
        }
        .thumbnails-container {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            overflow-x: auto;
            max-width: 100%;
            padding: 0.5rem;
        }
        .thumb-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.5;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .thumb-img.active, .thumb-img:hover {
            opacity: 1;
            border-color: var(--primary);
        }
        .card-actions {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 0.4rem;
            z-index: 10;
        }
        .action-btn {
            background-color: rgba(11, 15, 25, 0.85);
            border: 1px solid var(--border-color);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.25rem;
            transition: all 0.2s;
            outline: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .action-btn:hover {
            border-color: var(--primary);
            transform: scale(1.1);
        }
        .action-btn.fav.active {
            color: var(--gold);
            border-color: var(--gold);
            background-color: rgba(251, 191, 36, 0.15);
        }
        .action-btn.dismiss:hover {
            color: var(--danger);
            border-color: var(--danger);
            background-color: rgba(239, 68, 68, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Wallapop Wingfoil Dashboard</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.2rem;">Panel interactivo de resultados obtenidos en tiempo real</p>
            </div>
            <div id="update-timestamp" style="font-size: 0.85rem; color: var(--text-muted); text-align: right;"></div>
        </header>

        <div class="stats" style="margin-bottom: 2rem;">
            <div class="stat-card" style="min-width: 260px; flex: 1.2;">
                <h3>Resumen de Anuncios</h3>
                <div style="display: flex; justify-content: space-around; align-items: center; margin-top: 0.5rem; gap: 0.5rem;">
                    <div style="text-align: center; flex: 1;">
                        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Total</span>
                        <p id="stat-total" style="font-size: 1.5rem; color: #ffffff; font-weight: 700; margin-top: 0.1rem;">0</p>
                    </div>
                    <div style="text-align: center; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); flex: 1.2; padding: 0 0.5rem;">
                        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Disponibles</span>
                        <p id="stat-available" style="font-size: 1.5rem; color: #34d399; font-weight: 700; margin-top: 0.1rem;">0</p>
                    </div>
                    <div style="text-align: center; flex: 1;">
                        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Con Envío</span>
                        <p id="stat-shippable" style="font-size: 1.5rem; color: #a78bfa; font-weight: 700; margin-top: 0.1rem;">0</p>
                    </div>
                </div>
            </div>
            <div class="stat-card" style="min-width: 260px; flex: 1.5; border-color: rgba(16, 185, 129, 0.15);">
                <h3>Precios (Mín / Prom / Máx)</h3>
                <div style="display: flex; justify-content: space-around; align-items: center; margin-top: 0.5rem; gap: 0.5rem;">
                    <div style="text-align: center; flex: 1;">
                        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Mín</span>
                        <p id="price-min" style="font-size: 1.5rem; color: var(--primary); font-weight: 700; margin-top: 0.1rem;">0€</p>
                    </div>
                    <div style="text-align: center; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); flex: 1.2; padding: 0 0.5rem;">
                        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Prom</span>
                        <p id="price-avg" style="font-size: 1.5rem; color: #60a5fa; font-weight: 700; margin-top: 0.1rem;">0€</p>
                    </div>
                    <div style="text-align: center; flex: 1;">
                        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Máx</span>
                        <p id="price-max" style="font-size: 1.5rem; color: var(--danger); font-weight: 700; margin-top: 0.1rem;">0€</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls-panel" style="background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.2rem; margin-bottom: 2rem;">
            <div class="controls-header" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none;" onclick="toggleFilters()">
                <span style="font-weight: 700; font-size: 1.35rem; display: flex; align-items: center; gap: 0.5rem; color: #ffffff;">
                    🔍 Panel de Filtros y Búsqueda
                </span>
                <button id="toggle-filters-btn" style="background: transparent; border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-muted); padding: 0.5rem 1rem; font-size: 1.05rem; cursor: pointer; font-weight: 600; transition: all 0.2s;">
                    Ocultar Filtros
                </button>
            </div>
            
            <div id="filters-container" style="margin-top: 1.2rem; transition: max-height 0.3s ease-out, opacity 0.3s ease-out; overflow: hidden; max-height: 1200px; opacity: 1;">
            <!-- Fila 1: Búsqueda y Limpieza -->
            <div style="display: flex; gap: 1rem; width: 100%; flex-wrap: wrap; margin-bottom: 1rem;">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Buscar por título, ubicación o descripción...">
                </div>
                <button class="filter-btn" onclick="resetFilters()" style="background-color: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: var(--danger); font-weight: 600; padding: 0.8rem 1.5rem; font-size: 1.1rem;">Limpiar Filtros</button>
            </div>
            
            <!-- Fila 2: Rangos numéricos y Ordenación -->
            <div style="display: flex; gap: 1rem; width: 100%; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div style="display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center; border: 1px solid var(--border-color); padding: 0.6rem 1rem; border-radius: 8px; background-color: rgba(0,0,0,0.15);">
                    <div style="display: flex; align-items: center; gap: 0.4rem;">
                        <label for="liters-min" style="font-size: 1.05rem; color: var(--text-muted); font-weight: 600;">Litros Mín:</label>
                        <input type="number" id="liters-min" placeholder="Ej. 80" style="width: 85px; padding: 0.5rem 0.6rem; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-color); font-family: inherit; font-size: 1.1rem; outline: none;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.4rem;">
                        <label for="liters-max" style="font-size: 1.05rem; color: var(--text-muted); font-weight: 600;">Litros Máx:</label>
                        <input type="number" id="liters-max" placeholder="Ej. 120" style="width: 85px; padding: 0.5rem 0.6rem; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-color); font-family: inherit; font-size: 1.1rem; outline: none;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.4rem; border-left: 1px solid var(--border-color); padding-left: 0.8rem;">
                        <label for="wing-min" style="font-size: 1.05rem; color: var(--text-muted); font-weight: 600;">Ala Mín:</label>
                        <input type="number" step="0.1" id="wing-min" placeholder="Ej. 4" style="width: 75px; padding: 0.5rem 0.6rem; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-color); font-family: inherit; font-size: 1.1rem; outline: none;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.4rem;">
                        <label for="wing-max" style="font-size: 1.05rem; color: var(--text-muted); font-weight: 600;">Ala Máx:</label>
                        <input type="number" step="0.1" id="wing-max" placeholder="Ej. 6" style="width: 75px; padding: 0.5rem 0.6rem; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-color); font-family: inherit; font-size: 1.1rem; outline: none;">
                    </div>

                "41": { lat: 37.38, lon: -5.98 }, "42": { lat: 41.76, lon: -2.46 }, "43": { lat: 41.11, lon: 1.24 },  "44": { lat: 40.34, lon: -1.10 },
                "45": { lat: 39.86, lon: -4.02 }, "46": { lat: 39.46, lon: -0.37 }, "47": { lat: 41.65, lon: -4.72 }, "48": { lat: 43.26, lon: -2.93 },
                "49": { lat: 41.50, lon: -5.74 }, "50": { lat: 41.65, lon: -0.88 }, "51": { lat: 35.88, lon: -5.31 }, "52": { lat: 35.29, lon: -2.93 }
            };

            function getDistanceKm(item) {
                const loc = item.ubicacion || "";
                const cpMatch = loc.match(/\b(0[1-9]|[1-4][0-9]|5[0-2])\d{3}\b/);
                let prefix = null;
                if (cpMatch) {
                    prefix = cpMatch[1];
                } else {
                    const l = loc.toLowerCase();
                    if (l.includes("vitoria") || l.includes("alava") || l.includes("álava") || l.includes("gasteiz")) prefix = "01";
                    else if (l.includes("bilbao") || l.includes("bizkaia") || l.includes("vizcaya")) prefix = "48";
                    else if (l.includes("san sebastian") || l.includes("donostia") || l.includes("gipuzkoa") || l.includes("guipuzcoa")) prefix = "20";
                    else if (l.includes("logroño") || l.includes("rioja")) prefix = "26";
                    else if (l.includes("pamplona") || l.includes("iruña") || l.includes("navarra")) prefix = "31";
                    else if (l.includes("burgos")) prefix = "09";
                    else if (l.includes("santander") || l.includes("cantabria")) prefix = "39";
                    else if (l.includes("madrid")) prefix = "28";
                    else if (l.includes("barcelona")) prefix = "08";
                    else if (l.includes("valencia")) prefix = "46";
                    else if (l.includes("sevilla")) prefix = "41";
                    else if (l.includes("zaragoza")) prefix = "50";
                }

                if (!prefix || !provinceCoords[prefix]) return 9999;

                const baseLat = 42.85, baseLon = -2.67; // Vitoria-Gasteiz (01005)
                const target = provinceCoords[prefix];
                const dLat = (target.lat - baseLat) * Math.PI / 180;
                const dLon = (target.lon - baseLon) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                          Math.cos(baseLat * Math.PI / 180) * Math.cos(target.lat * Math.PI / 180) *
                          Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return Math.round(6371 * c);
            }

            // Ordenar
            if (currentSort === 'dist-asc') {
                filtered.sort((a, b) => getDistanceKm(a) - getDistanceKm(b));
            } else if (currentSort === 'dist-desc') {
                filtered.sort((a, b) => getDistanceKm(b) - getDistanceKm(a));
            } else if (currentSort === 'price-asc') {
                filtered.sort((a, b) => getCleanPrice(a) - getCleanPrice(b));
            } else if (currentSort === 'price-desc') {
                filtered.sort((a, b) => getCleanPrice(b) - getCleanPrice(a));
            } else if (currentSort === 'liters-asc') {
                filtered.sort((a, b) => getMaxLiters(a) - getMaxLiters(b));
            } else if (currentSort === 'liters-desc') {
                filtered.sort((a, b) => getMaxLiters(b) - getMaxLiters(a));
            } else if (currentSort === 'wing-asc') {
                filtered.sort((a, b) => getMaxWing(a) - getMaxWing(b));
            } else if (currentSort === 'wing-desc') {
                filtered.sort((a, b) => getMaxWing(b) - getMaxWing(a));
            } else if (currentSort === 'date-desc') {
                filtered.sort((a, b) => new Date(b.fecha_publicacion || 0) - new Date(a.fecha_publicacion || 0));
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-results">No se encontraron anuncios que coincidan con la búsqueda o filtros.</div>`;
                return;
            }

            filtered.forEach(item => {
                const itemIsHighlighted = isHighlighted(item);
                const card = document.createElement('div');
                card.className = 'card' + (itemIsHighlighted ? ' match' : '');

                // Botones de acción (Favoritos/Descartes)
                const isFav = favorites.includes(item.url);
                const isDismissed = dismissed.includes(item.url);
                
                const favBtnHtml = `<button class="action-btn fav${isFav ? ' active' : ''}" onclick="toggleFav('${item.url}', event)" title="${isFav ? 'Quitar de favoritos' : 'Marcar como favorito'}">★</button>`;
                
                let dismissBtnHtml = '';
                if (currentFilter === 'dismissed') {
                    dismissBtnHtml = `<button class="action-btn dismiss" onclick="restoreItem('${item.url}', event)" title="Recuperar anuncio">🔄</button>`;
                } else {
                    dismissBtnHtml = `<button class="action-btn dismiss" onclick="dismissItem('${item.url}', event)" title="Descartar anuncio">✕</button>`;
                }

                const actionsHtml = `
                    <div class="card-actions">
                        ${favBtnHtml}
                        ${dismissBtnHtml}
                    </div>
                `;

                // Badges
                let badgesHtml = '';
                if (itemIsHighlighted) {
                    badgesHtml += `<span class="badge badge-criteria">${hasActiveCriteria ? '¡Cumple Filtro!' : '¡Cumple Criterios!'}</span>`;
                }
                
                const statusValue = item.estado || 'Disponible';
                const statusClass = statusValue.toLowerCase();
                badgesHtml += `<span class="badge badge-status ${statusClass}">${statusValue}</span>`;

                const isShippable = item.envio === 'Envío disponible';
                badgesHtml += `<span class="badge badge-shipping ${isShippable ? '' : 'no'}">${item.envio}</span>`;

                if (item.litros_detectados && item.litros_detectados !== '[]') {
                    badgesHtml += `<span class="badge badge-info">${item.litros_detectados} Litros</span>`;
                }
                if (item.ala_detectada && item.ala_detectada !== '[]') {
                    badgesHtml += `<span class="badge badge-info">${item.ala_detectada}m Ala</span>`;
                }

                const imgs = item.imagen ? item.imagen.split('|') : [];
                let imageHtml = '';
                if (imgs.length > 0 && imgs[0] !== '') {
                    const badgePhotos = imgs.length > 1 ? `<span class="badge-photos-count">📸 ${imgs.length} fotos</span>` : '';
                    const itemIndex = listings.indexOf(item);
                    imageHtml = `
                        <div class="card-image-container" onclick="openGallery(${itemIndex}, 0)">
                            <img src="${imgs[0]}" class="card-image" alt="${item.titulo}" loading="lazy">
                            ${badgePhotos}
                            <div class="card-image-overlay">Ampliar galería</div>
                        </div>
                    `;
                } else {
                    imageHtml = `<div class="card-image-placeholder">Sin imagen de producto</div>`;
                }

                const distKm = getDistanceKm(item);
                const distTag = distKm < 9000 ? ` <span style="color: var(--primary); font-weight: 600;">(~${distKm} km)</span>` : '';

                card.innerHTML = `
                    ${actionsHtml}
                    ${imageHtml}
                    <div class="card-body">
                        <div>
                            <div class="card-header">
                                <span class="card-title" title="${item.titulo}">${item.titulo}</span>
                                <span class="card-price">${item.precio ? item.precio + '€' : 'N/D'}</span>
                            </div>
                            <div class="card-meta">
                                <span>📍 ${item.ubicacion}${distTag}</span>
                                <span>📅 ${item.fecha_publicacion}</span>
                            </div>
                            <div class="card-badges">
                                ${badgesHtml}
                            </div>
                            <div class="card-description" onclick="this.classList.toggle('expanded')" title="Haz clic para expandir la descripción">
                                ${item.descripcion}
                            </div>
                        </div>
                        <div class="card-footer">
                            <a href="${item.url}" target="_blank" class="btn-link">Ver en Wallapop</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Listeners para botones de filtrado principales
        document.querySelectorAll('#main-filter-group .filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#main-filter-group .filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                renderListings();
            });
        });

        // Listeners para filtros de categoría
        document.querySelectorAll('#category-filter-group .filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#category-filter-group .filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.getAttribute('data-category');
                renderListings();
            });
        });

        // Listener para caja de búsqueda
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderListings();
        });

        // Listeners para filtros numéricos (litros, vela y precios)
        document.getElementById('liters-min').addEventListener('input', () => renderListings());
        document.getElementById('liters-max').addEventListener('input', () => renderListings());
        document.getElementById('wing-min').addEventListener('input', () => renderListings());
        document.getElementById('wing-max').addEventListener('input', () => renderListings());
        document.getElementById('price-min-filter').addEventListener('input', () => renderListings());
        document.getElementById('price-max-filter').addEventListener('input', () => renderListings());

        // Listener para selector de orden
        document.getElementById('sort-select').addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderListings();
        });

        // --- Gallery Lightbox Modal Functions ---
        let activeGalleryItem = null;
        let activeImageIndex = 0;

        window.openGallery = function(itemIndex, imgIndex) {
            activeGalleryItem = listings[itemIndex];
            activeImageIndex = imgIndex;
            
            const modal = document.getElementById('gallery-modal');
            modal.style.display = 'flex';
            updateGalleryContent();
            
            document.addEventListener('keydown', handleKeyNavigation);
        };

        window.closeGallery = function() {
            const modal = document.getElementById('gallery-modal');
            modal.style.display = 'none';
            document.removeEventListener('keydown', handleKeyNavigation);
        };

        window.closeGalleryOnOutsideClick = function(event) {
            const modal = document.getElementById('gallery-modal');
            if (event.target === modal) {
                closeGallery();
            }
        };

        function updateGalleryContent() {
            if (!activeGalleryItem) return;
            const imgs = activeGalleryItem.imagen ? activeGalleryItem.imagen.split('|') : [];
            if (imgs.length === 0) return;
            
            if (activeImageIndex < 0) activeImageIndex = imgs.length - 1;
            if (activeImageIndex >= imgs.length) activeImageIndex = 0;
            
            const imgEl = document.getElementById('modal-image');
            imgEl.src = imgs[activeImageIndex];
            
            const infoEl = document.getElementById('modal-info');
            infoEl.innerText = `${activeGalleryItem.titulo} (${activeImageIndex + 1} de ${imgs.length})`;
            
            const thumbsEl = document.getElementById('modal-thumbnails');
            thumbsEl.innerHTML = '';
            
            if (imgs.length > 1) {
                imgs.forEach((imgSrc, idx) => {
                    const thumb = document.createElement('img');
                    thumb.src = imgSrc;
                    thumb.className = `thumb-img${idx === activeImageIndex ? ' active' : ''}`;
                    thumb.onclick = () => {
                        activeImageIndex = idx;
                        updateGalleryContent();
                    };
                    thumbsEl.appendChild(thumb);
                });
            }
        }

        window.prevImage = function() {
            activeImageIndex--;
            updateGalleryContent();
        };

        window.nextImage = function() {
            activeImageIndex++;
            updateGalleryContent();
        };

        function handleKeyNavigation(e) {
            if (e.key === 'ArrowLeft') {
                prevImage();
            } else if (e.key === 'ArrowRight') {
                nextImage();
            } else if (e.key === 'Escape') {
                closeGallery();
            }
        }

        // Render inicial
        renderListings();

        // Colapsar filtros por defecto en móviles al cargar
        if (window.innerWidth < 768) {
            const container = document.getElementById('filters-container');
            const btn = document.getElementById('toggle-filters-btn');
            container.style.maxHeight = '0px';
            container.style.opacity = '0';
            btn.innerText = 'Mostrar Filtros';
        }
    </script>

    <!-- Modal para visualización de fotos -->
    <div id="gallery-modal" class="modal" onclick="closeGalleryOnOutsideClick(event)">
        <div class="modal-content-wrapper">
            <span class="close-btn" onclick="closeGallery()">&times;</span>
            <button class="nav-btn prev-btn" onclick="prevImage()">&lsaquo;</button>
            <img id="modal-image" class="modal-img" src="" alt="Vista completa">
            <button class="nav-btn next-btn" onclick="nextImage()">&rsaquo;</button>
            <div id="modal-info" class="modal-info"></div>
            <div id="modal-thumbnails" class="thumbnails-container"></div>
        </div>
    </div>
</body>
</html>
